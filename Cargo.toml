[workspace]
default-members = [
    "rtic",
    "rtic-sync",
    "rtic-common",
    "rtic-macros",
    "rtic-macros/rtic-macros-ui-tests",
    "rtic-monotonics",
    "rtic-time",
    "rtic-distributions/cortex-m-rtic",
]
members = [
    "rtic",
    "rtic-sync",
    "rtic-common",
    "rtic-macros",
    "rtic-macros/rtic-macros-ui-tests",
    "rtic-monotonics",
    "rtic-time",
    "xtask",
    "rtic-distributions/cortex-m-rtic",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true

# do not optimize proc-macro deps or build scripts
[profile.dev.build-override]
codegen-units = 16
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false


[profile.release.build-override]
codegen-units = 16
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false
